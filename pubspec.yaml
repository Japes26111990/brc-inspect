name: brc_inspect
description: "BRC Inspect App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  mobile_scanner: ^7.2.0
  # 🛠️ THE FIX: Downgraded to the incredibly stable versions built for your SDK
  pdf: ^3.11.0
  printing: ^5.11.1
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logos/

# 🚀 Adaptive background mapping for sleek app icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/brc_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B132B"
  adaptive_icon_foreground: "assets/logos/brc_logo.png"