name: brc_inspect
description: "BRC Inspect App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  mobile_scanner: ^7.2.0
  pdf: ^3.12.0
  printing: ^5.14.3
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logos/

# 🚀 UPDATED: Added adaptive background mapping to kill the white borders
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/brc_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B132B" # 🌟 Change this to match your exact dark navy blue hex code
  adaptive_icon_foreground: "assets/logos/brc_logo.png"